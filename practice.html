<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Layout Mastery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">Header</header>

    <!-- MAIN LAYOUT -->
    <main class="layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">Sidebar</aside>

      <!-- CONTENT AREA -->
      <section class="content">
        <div class="content-1">Content-1</div>

        <div class="content-row">
          <div class="content-2">Content-2</div>
          <div class="content-3">Content-3</div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">Footer</footer>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      /* PAGE BACKGROUND */
      body {
        background: #2f3542;
        padding: 20px;
      }
      /* COMMON BOX STYLE */
      .header,
      .footer,
      .sidebar,
      .content-1,
      .content-2,
      .content-3 {
        color: #fff;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      }
      .header,
      .footer {
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        height: 70px;
        margin-bottom: 20px;
      }

      .footer {
        margin-top: 20px;
      } /* MAIN LAYOUT */
      .layout {
        display: flex;
        gap: 20px;
      }
      .sidebar {
        background: linear-gradient(135deg, #00cec9, #20bf6b);
        width: 220px;
        min-height: 350px;
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      } /* CONTENT-1 */
      .content-1 {
        background: linear-gradient(135deg, #5f6ee7, #2aa8ff);
        height: 180px;
      }
      /* CONTENT ROW */
      .content-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      /* CONTENT-2 & 3 */
      .content-2,
      .content-3 {
        background: linear-gradient(135deg, #4b7bec, #45aaf2);
        height: 150px;
      }
    </style>
  </body>
</html>
